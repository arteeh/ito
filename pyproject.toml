[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ito"
version = "1.0.0"
description = "Immersive teleoperation: one pilot, one robot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiortc>=1.14,<2",
    "aiohttp>=3.12,<4",
    "pydantic>=2.11,<3",
    "moderngl>=5.12,<6",
    "numpy>=2,<3",
    "pillow>=12.3.0",
    "pygame-ce>=2.5,<3",
    "imgui-bundle>=1.92,<2",
    "pyopengl>=3.1.10,<4",
    "pyopenxr>=1.1.6302,<2",
]

[project.scripts]
ito = "ito.app.__main__:main"
ito-driver-microduck = "drivers.microduck.cli:main"

[project.optional-dependencies]
# The virtual Microduck's body (drivers/microduck/sim.py), at microduck_rl's locked versions.
sim = ["mujoco==3.10.0", "onnxruntime==1.24.4", "opencv-python-headless==4.11.0.86"]

[tool.hatch.build.targets.wheel]
packages = ["ito", "drivers"]

[dependency-groups]
dev = [
    "imageio-ffmpeg>=0.6",
    "ruff>=0.13",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
