[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ito"
version = "1.0.0"
description = "Immersive teleoperation: one pilot, one robot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiortc>=1.14,<2",
    "aiohttp>=3.12,<4",
    "pydantic>=2.11,<3",
    "numpy>=2,<3",
    "pillow>=12.3.0",
    "pygame-ce>=2.5,<3",
    "imgui-bundle>=1.92,<2",
    "vulkan>=1.3.275.1,<2",
    "pyopenxr>=1.1.6302,<2",
]

[project.scripts]
ito = "ito.app.__main__:main"
ito-driver-microduck = "drivers.microduck.cli:main"

[project.optional-dependencies]
# The virtual Microduck's body (drivers/microduck/sim.py), at microduck_rl's locked versions.
sim = ["mujoco==3.10.0", "onnxruntime==1.24.4", "opencv-python-headless==4.11.0.86"]
# The reconstruction methods' models (ito/recon), bundled in the Windows release with weights.
recon = [
    "torch>=2.11,<3",
    "einops>=0.8,<1",
    "addict>=2.4,<3",
    "safetensors>=0.6,<1",
    "transformers>=5.22,<6",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", extra = "recon" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["ito", "drivers"]
# SPIR-V compiled from ito/shaders by tools/shaders.py (not in git).
artifacts = ["ito/shaders/*.spv"]

[dependency-groups]
dev = [
    "imageio-ffmpeg>=0.6",
    "ruff>=0.13",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["third_party", "ito/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
