[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ito"
version = "1.0.0"
description = "Immersive teleoperation: one pilot, one robot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiortc>=1.14,<2",
    "aiohttp>=3.12,<4",
    "pydantic>=2.11,<3",
    "moderngl>=5.12,<6",
    "numpy>=2,<3",
    "plyfile>=1.1,<2",
    "pygame-ce>=2.5,<3",
    "mujoco>=3.3,<4",
    "imgui-bundle>=1.92,<2",
    "pyopengl>=3.1.10,<4",
    "pyopenxr>=1.1.6302,<2",
    "sounddevice>=0.5,<1",
]

[project.scripts]
ito = "ito.app.__main__:main"
ito-driver = "ito.driver.cli:main"
ito-driver-mujoco = "drivers.mujoco.cli:main"
ito-desktop = "ito.desktop.__main__:main"

[project.optional-dependencies]
cuda = [
    "cupy-cuda12x[ctk]>=14,<15",
]

slam = [
    "torch==2.5.1; python_version < '3.13'",
    "torchvision==0.20.1; python_version < '3.13'",
    "cupy-cuda12x==13.6.0",
    # CuPy compiles with torch's NVRTC; these CUDA headers spare pilots the CUDA Toolkit.
    "nvidia-cuda-runtime-cu12==12.4.127",
    "einops==0.8.1",
    "huggingface-hub==0.30.2",
    "safetensors==0.5.3",
    "opencv-python-headless==4.11.0.86",
    "scipy==1.15.3",
    "pyyaml==6.0.2",
    "platformdirs==4.3.8",
    "filelock==3.18.0",
    "ninja==1.11.1.4",
    "psutil==7.1.3",
    "setuptools==75.8.0",
]

[tool.uv]
conflicts = [[{ extra = "cuda" }, { extra = "slam" }]]

[tool.uv.sources]
torch = [{ index = "pytorch-cu124", extra = "slam" }]
torchvision = [{ index = "pytorch-cu124", extra = "slam" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["ito", "drivers"]

[dependency-groups]
dev = ["psutil>=7,<8", "ruff>=0.13"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
