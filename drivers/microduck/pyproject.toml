# The Microduck driver's own dependencies, without the pilot app's (compose.yaml installs these).
[project]
name = "ito-driver-microduck"
version = "1.0.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "aiortc==1.14.0",
    "aiohttp==3.13.3",
    "pydantic==2.12.5",
    "numpy==2.2.6",
    "opencv-python-headless==4.11.0.86",
]
