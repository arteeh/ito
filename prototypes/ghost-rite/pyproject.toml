[project]
name = "ito-theme-lab"
version = "0.1.0"
description = "A standalone slice of Ito's ImGui screens for trying themes and fonts"
requires-python = ">=3.12,<3.13"
dependencies = [
    "imgui-bundle==1.92.900",  # same as Ito main
    "moderngl>=5.12,<6",
    "PyOpenGL>=3.1.7",
    "numpy>=2",
    "pillow>=10",
]

[tool.uv]
package = false
